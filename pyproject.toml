[project]
name = "next-token-gen-model"
version = "0.1.0"
description = "LSTM next-token prediction for news articles"
readme = "README.md"
authors = [
    { name = "Yasas Banu", email = "yixbinfo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "nltk>=3.8,<4",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "tensorflow>=2.16,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "jupyter>=1.0,<2",
]
